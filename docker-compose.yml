services:
  # 前端服务（Node.js + React）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000
      # OAuth configuration (optional - leave empty if not using OAuth)
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL:-}
      - VITE_APP_ID=${VITE_APP_ID:-}
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-production}
      # Analytics configuration (optional - leave empty if not using analytics)
      - VITE_ANALYTICS_ENDPOINT=${VITE_ANALYTICS_ENDPOINT:-}
      - VITE_ANALYTICS_WEBSITE_ID=${VITE_ANALYTICS_WEBSITE_ID:-}
    depends_on:
      - backend
    networks:
      - pptagent-network

  # PostgreSQL 数据库服务
  db:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16-alpine
    container_name: pptagent_db
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-pptagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pptagent_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-pptagent_dev}
    volumes:

      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pptagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pptagent -d pptagent_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务（Python FastAPI + PPTAgent）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # 数据库连接配置
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pptagent}:${POSTGRES_PASSWORD:-pptagent_secret_2024}@db:5432/${POSTGRES_DB:-pptagent_dev}
      # PPTAgent LLM Configuration
      - PPTAGENT_MODEL=${PPTAGENT_MODEL}
      - PPTAGENT_API_KEY=${PPTAGENT_API_KEY}
      - PPTAGENT_API_BASE=${PPTAGENT_API_BASE}
      # Knowledge Base LLM Configuration
      - KNOWLEDGE_LLM_BASE_URL=${KNOWLEDGE_LLM_BASE_URL}
      - KNOWLEDGE_LLM_API_KEY=${KNOWLEDGE_LLM_API_KEY}
      - KNOWLEDGE_LLM_MODEL=${KNOWLEDGE_LLM_MODEL}
      - KNOWLEDGE_EMBEDDING_MODEL=${KNOWLEDGE_EMBEDDING_MODEL}
      # MinerU API Key
      - MINERU_API_KEY=${MINERU_API_KEY}
      # Tavily API Keys
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_BACKUP=${TAVILY_BACKUP}
      # HuggingFace 配置 - 解决模型下载问题
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_OFFLINE=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pptagent-network
    volumes:
      - ppt-workspace:/tmp/ppt_workspace
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true

volumes:
  ppt-workspace:
  postgres_data:

networks:
  pptagent-network:
    driver: bridge
