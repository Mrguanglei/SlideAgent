[pytest]
addopts = -ra --strict-markers -m "not llm and not parse" --ignore=test_new_pptx_export.py --ignore=test_pptx_generator.py
testpaths =
    .
python_files = test_*.py
markers =
    llm: tests requiring live LLM credentials/endpoints
    parse: tests requiring external document parsing services
    unit: pure unit tests without external services
    integration: tests that need local services (db/http)
    e2e: end-to-end tests across multiple services
